<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio</title>
<style>
  :root {
    --accent: #D85A30;
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --border: #E5E3DD;
    --text: #1C1B19;
    --text-secondary: #6B6862;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 90px;
  }
  .hidden { display: none !important; }

  /* Header */
  header {
    background: var(--accent);
    color: #fff;
    padding: 20px 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header img {
    width: 48px; height: 48px; border-radius: 50%;
    object-fit: cover; background: #fff;
  }
  header .info h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .info p { font-size: 13px; margin: 4px 0 0; opacity: 0.9; }

  /* Categories nav */
  nav.cats {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  nav.cats button {
    flex-shrink: 0; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-secondary); padding: 6px 14px; border-radius: 999px;
    font-size: 13px; cursor: pointer;
  }
  nav.cats button.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .category-title {
    font-size: 15px; font-weight: 600; margin: 20px 0 10px;
  }
  .category-title:first-child { margin-top: 0; }

  .product {
    display: flex; gap: 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px; margin-bottom: 10px; align-items: center;
  }
  .product img {
    width: 64px; height: 64px; border-radius: 8px; object-fit: cover;
    background: var(--bg); flex-shrink: 0;
  }
  .product .body { flex: 1; min-width: 0; }
  .product .body h3 { font-size: 14px; margin: 0; font-weight: 600; }
  .product .body p { font-size: 12px; color: var(--text-secondary); margin: 3px 0; }
  .product .body .price { font-size: 14px; font-weight: 600; margin: 0; }
  .product button.add {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 18px; cursor: pointer;
    flex-shrink: 0;
  }

  /* Floating cart bar */
  .cart-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--accent); color: #fff;
    padding: 14px 20px; display: flex; justify-content: space-between;
    align-items: center; cursor: pointer;
  }
  .cart-bar span { font-size: 14px; font-weight: 600; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; justify-content: center; z-index: 100;
  }
  .modal {
    background: var(--surface); width: 100%; max-width: 640px;
    border-radius: 16px 16px 0 0; padding: 20px; max-height: 85vh;
    overflow-y: auto;
  }
  .modal h2 { margin: 0 0 16px; font-size: 17px; }
  .cart-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .cart-item .qty-ctrl { display: flex; align-items: center; gap: 8px; }
  .cart-item .qty-ctrl button {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer;
  }
  .cart-total {
    display: flex; justify-content: space-between; font-weight: 600;
    font-size: 16px; padding: 14px 0;
  }
  input[type=text], input[type=tel] {
    width: 100%; padding: 10px; border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 14px; margin-bottom: 10px;
  }
  .btn-primary {
    width: 100%; padding: 13px; border: none; border-radius: var(--radius);
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .btn-secondary {
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius);
    background: transparent; color: var(--text-secondary); font-size: 14px;
    cursor: pointer; margin-top: 8px;
  }
  .closed-banner {
    background: #FCEBEB; color: #791F1F; font-size: 13px;
    padding: 10px 16px; text-align: center;
  }
  .state-msg { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
</style>
</head>
<body>

<div id="app">
  <div class="state-msg" id="loading-msg">Carregando cardápio...</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ====== CONFIGURAÇÃO ======
const SUPABASE_URL = 'https://feqjlanpcurjppobrckd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlcWpsYW5wY3VyanBwb2JyY2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNzkxNzEsImV4cCI6MjEwNDY1NTE3MX0.ESa6QeJHuCoOC6rsk3c3EcBSAvplaXfFe2uZmdIBRpU';
// ===========================

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

const params = new URLSearchParams(window.location.search);
const slug = params.get('loja');

let business = null;
let categories = [];
let products = [];
let hours = [];
let cart = {}; // { product_id: qty }

async function init() {
  if (!slug) {
    app.innerHTML = '<div class="state-msg">Link inválido. Use ?loja=slug-do-negocio na URL.</div>';
    return;
  }

  const { data: biz, error: bizErr } = await supabase
    .from('businesses')
    .select('*')
    .eq('slug', slug)
    .eq('is_active', true)
    .single();

  if (bizErr || !biz) {
    app.innerHTML = '<div class="state-msg">Negócio não encontrado.</div>';
    return;
  }
  business = biz;
  document.title = business.name;
  document.documentElement.style.setProperty('--accent', business.primary_color || '#D85A30');

  const [{ data: cats }, { data: prods }, { data: hrs }] = await Promise.all([
    supabase.from('categories').select('*').eq('business_id', business.id).order('sort_order'),
    supabase.from('products').select('*').eq('business_id', business.id).eq('is_available', true).order('sort_order'),
    supabase.from('business_hours').select('*').eq('business_id', business.id)
  ]);
  categories = cats || [];
  products = prods || [];
  hours = hrs || [];

  render();
}

function isOpenNow() {
  const now = new Date();
  const today = hours.find(h => h.day_of_week === now.getDay());
  if (!today || today.is_closed || !today.opens_at || !today.closes_at) return false;
  const cur = now.getHours() * 60 + now.getMinutes();
  const [oh, om] = today.opens_at.split(':').map(Number);
  const [ch, cm] = today.closes_at.split(':').map(Number);
  return cur >= (oh * 60 + om) && cur <= (ch * 60 + cm);
}

function cartCount() {
  return Object.values(cart).reduce((a, b) => a + b, 0);
}
function cartTotal() {
  return Object.entries(cart).reduce((sum, [id, qty]) => {
    const p = products.find(p => p.id === id);
    return sum + (p ? p.price * qty : 0);
  }, 0);
}
function money(n) {
  return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function render() {
  const open = isOpenNow();
  let html = `
    <header>
      <img src="${business.logo_url || ''}" onerror="this.style.display='none'">
      <div class="info">
        <h1>${business.name}</h1>
        <p>${open ? 'Aberto agora' : 'Fechado no momento'}</p>
      </div>
    </header>
  `;
  if (!open) {
    html += `<div class="closed-banner">Estamos fechados agora, mas você pode ver o cardápio.</div>`;
  }

  html += `<nav class="cats" id="cats-nav">
    <button class="active" data-cat="all">Todos</button>
    ${categories.map(c => `<button data-cat="${c.id}">${c.name}</button>`).join('')}
  </nav>`;

  html += `<main id="product-list">`;
  const grouped = categories.length
    ? categories.map(c => ({ cat: c, items: products.filter(p => p.category_id === c.id) }))
    : [{ cat: null, items: products }];

  for (const group of grouped) {
    if (!group.items.length) continue;
    if (group.cat) html += `<div class="category-title">${group.cat.name}</div>`;
    for (const p of group.items) {
      html += `
        <div class="product" data-catid="${p.category_id || 'none'}">
          <img src="${p.image_url || ''}" onerror="this.style.display='none'">
          <div class="body">
            <h3>${p.name}</h3>
            ${p.description ? `<p>${p.description}</p>` : ''}
            <p class="price">${money(p.price)}</p>
          </div>
          <button class="add" data-id="${p.id}">+</button>
        </div>
      `;
    }
  }
  html += `</main>`;

  html += `<div class="cart-bar hidden" id="cart-bar">
    <span id="cart-count-label"></span>
    <span id="cart-total-label"></span>
  </div>`;

  app.innerHTML = html;
  attachEvents();
  updateCartBar();
}

function attachEvents() {
  document.querySelectorAll('.add').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      cart[id] = (cart[id] || 0) + 1;
      updateCartBar();
    });
  });

  document.querySelectorAll('#cats-nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#cats-nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const cat = btn.dataset.cat;
      document.querySelectorAll('.category-title').forEach(t => t.style.display = '');
      document.querySelectorAll('.product').forEach(p => {
        p.style.display = (cat === 'all' || p.dataset.catid === cat) ? '' : 'none';
      });
    });
  });

  document.getElementById('cart-bar').addEventListener('click', openCartModal);
}

function updateCartBar() {
  const bar = document.getElementById('cart-bar');
  const count = cartCount();
  if (count === 0) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  document.getElementById('cart-count-label').textContent = `Ver carrinho · ${count} ${count === 1 ? 'item' : 'itens'}`;
  document.getElementById('cart-total-label').textContent = money(cartTotal());
}

function openCartModal() {
  const items = Object.entries(cart).filter(([, qty]) => qty > 0);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>Seu pedido</h2>
      ${items.map(([id, qty]) => {
        const p = products.find(p => p.id === id);
        return `<div class="cart-item">
          <span>${p.name}</span>
          <div class="qty-ctrl">
            <button data-id="${id}" data-action="dec">−</button>
            <span>${qty}</span>
            <button data-id="${id}" data-action="inc">+</button>
          </div>
        </div>`;
      }).join('')}
      <div class="cart-total"><span>Total</span><span>${money(cartTotal())}</span></div>
      <input type="text" id="customer-name" placeholder="Seu nome">
      <input type="tel" id="customer-phone" placeholder="Seu telefone (com DDD)">
      <button class="btn-primary" id="confirm-order">Confirmar pedido</button>
      <button class="btn-secondary" id="close-modal">Voltar ao cardápio</button>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      cart[id] += btn.dataset.action === 'inc' ? 1 : -1;
      if (cart[id] <= 0) delete cart[id];
      overlay.remove();
      updateCartBar();
      if (cartCount() > 0) openCartModal();
    });
  });
  overlay.querySelector('#close-modal').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#confirm-order').addEventListener('click', () => submitOrder(overlay));
}

async function submitOrder(overlay) {
  const name = document.getElementById('customer-name').value.trim();
  const phone = document.getElementById('customer-phone').value.trim();
  if (!name) { alert('Digite seu nome para continuar.'); return; }

  const items = Object.entries(cart).map(([id, qty]) => {
    const p = products.find(p => p.id === id);
    return { product_id: id, name: p.name, price: p.price, qty };
  });
  const total = cartTotal();

  const { error } = await supabase.from('orders').insert({
    business_id: business.id,
    customer_name: name,
    customer_phone: phone,
    items,
    total,
    status: 'pending'
  });

  if (error) {
    alert('Não foi possível enviar o pedido. Tente novamente.');
    return;
  }

  const lines = items.map(i => `${i.qty}x ${i.name} - ${money(i.price * i.qty)}`).join('\n');
  const message = `Novo pedido de ${name}:\n\n${lines}\n\nTotal: ${money(total)}`;
  const waNumber = (business.whatsapp_number || '').replace(/\D/g, '');
  const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;

  cart = {};
  overlay.remove();
  updateCartBar();
  window.location.href = waUrl;
}

init();
</script>
</body>
</html>
